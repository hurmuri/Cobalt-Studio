name: Feature request
description: A concrete change to the Windows app or phone page
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Cobalt Studio stays a download tool. Requests for login bypass, DRM bypass, or private-content access will be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult in the current app?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Desktop
        - Phone page
        - Downloads
        - Packaging
        - Something else
    validations:
      required: true
