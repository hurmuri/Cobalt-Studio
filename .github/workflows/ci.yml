name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Windows unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch the pinned cobalt source
        shell: pwsh
        run: .\scripts\setup-cobalt.ps1 -SourceOnly
      - name: Install Cobalt Studio dependencies
        run: npm ci
      - name: Config, network, and Instagram patch
        run: node test/config.test.mjs && node test/network.test.mjs && node test/instagram.test.mjs
