<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Cobalt Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="desktop">
    <div class="app-layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <rect width="64" height="64" rx="14" />
              <path class="brand-bars" d="M20 15h9v34h-9zM35 15h9v13H35zM35 34h9v15H35z" />
            </svg>
          </span>
          <span class="brand-name">Cobalt</span>
        </div>

        <nav class="side-nav" aria-label="下载器导航">
          <button class="nav-item active" id="downloadNav" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
            </svg>
            <span>下载</span>
          </button>
          <button class="nav-item" id="settingsNav" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 7.5h4M11.5 7.5H20.5M3.5 16.5h7M15 16.5h5.5" />
              <circle cx="9.5" cy="7.5" r="2" />
              <circle cx="13" cy="16.5" r="2" />
            </svg>
            <span>设置</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer">
          <div class="health" id="health"><i></i><span>连接中</span></div>
          <a class="source-link" href="https://github.com/hurmuri/Cobalt-Studio" target="_blank" rel="noreferrer" title="Cobalt Studio 源代码，AGPL-3.0">源代码</a>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="quick-search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8" />
              <path d="m16 16 4 4" />
            </svg>
            <input id="quickInput" type="search" autocomplete="off" spellcheck="false" aria-label="下载链接或任务搜索" placeholder="粘贴链接直接下载，或搜索任务" />
            <span class="proxy-indicator" id="proxyIndicator" title="下载使用系统 HTTP/HTTPS 代理">代理</span>
          </div>
          <button class="primary-button quick-download" id="quickDownloadButton" type="button">下载</button>
          <button class="new-task-button" id="newTaskButton" type="button" title="新建任务并选择下载选项">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span>新建</span>
          </button>
          <div class="topbar-spacer"></div>
          <button class="icon-button top-icon" id="qrButton" type="button" title="手机访问" aria-label="手机访问">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="3.5" width="6" height="6" rx="1" />
              <rect x="14.5" y="3.5" width="6" height="6" rx="1" />
              <rect x="3.5" y="14.5" width="6" height="6" rx="1" />
              <path d="M14.5 14.5h2.5v2.5h-2.5zM19 14.5h1.5V18H19zM14.5 19H18v1.5h-3.5zM20 19h.5" />
            </svg>
          </button>
          <button class="icon-button top-icon" id="openDirTop" type="button" title="打开下载目录" aria-label="打开下载目录">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 8h7l2 2h9v9H3z" />
              <path d="M3 8V5h7l2 2h7" />
            </svg>
          </button>
        </header>

        <section class="content">
          <div class="content-head">
            <div class="tabs" role="tablist" aria-label="任务分类">
              <button class="tab active" data-filter="active" type="button">
                下载中 <span id="countActive">0</span>
              </button>
              <button class="tab" data-filter="done" type="button">
                已完成 <span id="countDone">0</span>
              </button>
            </div>
            <div class="content-tools">
              <button class="text-button" id="clearFinished" type="button">清除已完成</button>
            </div>
          </div>

          <div class="list-summary">
            <span id="queueSummary">正在读取任务</span>
          </div>

          <div class="task-list" id="taskList" aria-live="polite">
            <div class="task-empty" id="taskEmpty">
              <span class="task-empty-icon" aria-hidden="true">
                <svg viewBox="0 0 96 96">
                  <path d="m20 35 28-14 28 14-28 14-28-14Z" />
                  <path d="M20 35v30l28 14V49M76 35v30L48 79" />
                  <path d="m57 23 11-5 8 13-9 16" class="accent" />
                </svg>
              </span>
              <span class="task-empty-label" id="emptyTitle">暂无下载任务</span>
              <button class="small-primary" id="emptyNewTask" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                新建任务
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="newTaskDialog" class="modal new-task-modal" aria-labelledby="newTaskTitle">
      <form class="modal-card" id="downloadForm" novalidate>
        <div class="modal-head">
          <div><h2 class="modal-title" id="newTaskTitle">新建任务</h2><p class="modal-subtitle">添加链接，并为这次下载选择输出选项。</p></div>
          <button class="close-button" type="button" data-close="newTaskDialog" aria-label="关闭">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="new-task-field"><label class="settings-label" for="urlInput">下载链接</label>
        <textarea id="urlInput" class="resize-none" name="url" rows="6" inputmode="url" autocomplete="off" spellcheck="false" aria-describedby="formMessage"
          placeholder="粘贴完整链接&#10;多个链接请每行输入一个" required></textarea></div>
        <div class="download-options">
          <label>类型
            <select id="modeSelect" name="mode">
              <option value="auto">视频 + 音频</option>
              <option value="audio">仅音频</option>
              <option value="mute">无声视频</option>
            </select>
          </label>
          <label id="qualityWrap">画质
            <select id="qualitySelect" name="quality">
              <option value="max">最高</option>
              <option value="2160">4K</option>
              <option value="1440">1440p</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
            </select>
          </label>
          <label id="formatWrap" class="audio-only">音频格式
            <select id="formatSelect" name="format">
              <option value="best">最佳</option>
              <option value="mp3">MP3</option>
              <option value="ogg">OGG</option>
              <option value="opus">OPUS</option>
              <option value="wav">WAV</option>
            </select>
          </label>
        </div>
        <p class="form-message" id="formMessage" role="status"></p>
        <div class="modal-actions">
          <button class="quiet-button" type="button" data-close="newTaskDialog">取消</button>
          <button class="primary-button" id="submitButton" type="submit">立即下载</button>
        </div>
      </form>
    </dialog>

    <dialog id="qrDialog" class="modal" aria-labelledby="qrTitle">
      <div class="modal-card qr-modal-card">
        <div class="modal-head">
          <h2 class="modal-title" id="qrTitle">手机访问</h2>
          <button class="close-button" type="button" data-close="qrDialog" aria-label="关闭">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <div class="qr-address-field">
          <label for="qrAddress">访问地址</label>
          <select id="qrAddress" aria-describedby="qrAddressHint" disabled><option value="">正在读取地址…</option></select>
          <p class="modal-description" id="qrAddressHint">选择手机可以访问的电脑地址。</p>
        </div>
        <div class="qr-frame" id="qrFrame"><span>正在生成二维码</span></div>
        <div class="qr-url" id="qrUrl"></div>
        <div class="qr-network">
          <span id="qrNetworkLabel">正在检查局域网</span>
          <span class="qr-network-actions">
            <button class="qr-network-button" id="copyQrUrl" type="button">复制地址</button>
            <button class="qr-network-button" id="repairLan" type="button">修复局域网访问</button>
          </span>
        </div>
        <p class="qr-note" id="qrAccessNote">请使用手机系统浏览器打开。电脑能打开该地址不代表手机已连通。</p>
        <div class="qr-note" id="lanDiagnostics" role="status"></div>
        <div class="modal-actions">
          <button class="quiet-button" id="refreshQr" type="button">刷新二维码</button>
          <a class="quiet-button link-button" id="openMobileLink" href="/mobile" target="_blank" rel="noreferrer">在浏览器打开</a>
        </div>
      </div>
    </dialog>

    <dialog id="settingsDialog" class="modal settings-modal" aria-labelledby="settingsTitle" aria-describedby="settingsSubtitle">
      <form class="modal-card settings-modal-card" id="settingsForm" novalidate>
        <div class="modal-head">
          <div><h2 class="modal-title" id="settingsTitle">设置</h2><p class="modal-subtitle" id="settingsSubtitle">统一设置保存位置、默认输出和列表显示。</p></div>
          <button class="close-button" type="button" data-close="settingsDialog" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
        </div>
        <div class="settings-body">
          <section class="settings-group" aria-labelledby="settingsDownloadTitle">
            <h2 id="settingsDownloadTitle">下载与存储</h2>
            <div class="settings-fields">
              <div class="settings-row setting-wide">
                <label class="settings-label" for="settingsDir">保存位置</label>
                <div class="settings-control input-with-action"><input id="settingsDir" name="downloadDir" type="text" required aria-describedby="settingsMessage" /><button class="field-action" id="settingsOpenDir" type="button">打开</button></div>
              </div>
              <label class="settings-row"><span class="settings-label">同时下载</span><span class="settings-control"><select id="settingsConcurrent" name="maxConcurrent"><option value="1">1 个任务</option><option value="2">2 个任务</option><option value="3">3 个任务</option><option value="4">4 个任务</option><option value="5">5 个任务</option><option value="6">6 个任务</option><option value="7">7 个任务</option><option value="8">8 个任务</option><option value="9">9 个任务</option><option value="10">10 个任务</option></select></span></label>
              <label class="settings-row"><span class="settings-label">多项目帖子</span><span class="settings-control"><select id="settingsPicker" name="picker"><option value="first">只取第一项</option><option value="all">全部下载</option></select></span></label>
            </div>
          </section>
          <section class="settings-group" aria-labelledby="settingsOutputTitle">
            <h2 id="settingsOutputTitle">默认输出</h2>
            <div class="settings-fields">
              <label class="settings-row"><span class="settings-label">默认类型</span><span class="settings-control"><select id="settingsMode" name="downloadMode"><option value="auto">视频 + 音频</option><option value="audio">仅音频</option><option value="mute">无声视频</option></select></span></label>
              <label class="settings-row"><span class="settings-label">最高画质</span><span class="settings-control"><select id="settingsQuality" name="videoQuality"><option value="max">最高</option><option value="2160">4K</option><option value="1440">1440p</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select></span></label>
              <label class="settings-row"><span class="settings-label">音频格式</span><span class="settings-control"><select id="settingsFormat" name="audioFormat"><option value="best">最佳</option><option value="mp3">MP3</option><option value="ogg">OGG</option><option value="opus">OPUS</option><option value="wav">WAV</option></select></span></label>
              <label class="settings-row"><span class="settings-label">文件名</span><span class="settings-control"><select id="settingsStyle" name="filenameStyle"><option value="pretty">清晰易读</option><option value="classic">经典</option><option value="basic">简洁</option><option value="nerdy">保留技术信息</option></select></span></label>
            </div>
          </section>
          <section class="settings-group" aria-labelledby="settingsDisplayTitle">
            <h2 id="settingsDisplayTitle">列表显示</h2>
            <label class="settings-toggle-row"><span class="settings-label">媒体缩略图<small>在任务列表显示封面，关闭可减少图片加载。</small></span><input class="switch" id="settingsThumbnails" name="showThumbnails" type="checkbox" role="switch" /></label>
          </section>
          <section class="settings-group" aria-labelledby="settingsNetworkTitle">
            <h2 id="settingsNetworkTitle">网络</h2>
            <div class="settings-row settings-static"><span class="settings-label">连接方式</span><span class="settings-value"><strong id="settingsProxy">读取中…</strong><small id="settingsProxyHint">下载会自动沿用系统 HTTP/HTTPS 代理</small></span></div>
          </section>
        </div>
        <div class="settings-footer"><p class="form-message" id="settingsMessage" role="status"></p><div class="modal-actions"><button class="quiet-button" type="button" data-close="settingsDialog">取消</button><button class="primary-button" type="submit">保存</button></div></div>
      </form>
    </dialog>

    <dialog id="confirmDialog" class="modal confirm-modal" aria-labelledby="confirmTitle" aria-describedby="confirmText">
      <div class="modal-card">
        <div class="modal-head">
          <div class="modal-title" id="confirmTitle">删除任务？</div>
          <button class="close-button" type="button" data-close="confirmDialog" aria-label="关闭">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>
        <p class="modal-description" id="confirmText">只会从列表移除，不会删除已经下载的文件。</p>
        <div class="modal-actions">
          <button class="quiet-button" type="button" data-close="confirmDialog">取消</button>
          <button class="danger-button" id="confirmButton" type="button">删除</button>
        </div>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/vendor/gsap.min.js"></script>
    <script src="/vendor/ScrollTrigger.min.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
